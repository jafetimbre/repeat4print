[project]
name = "repeat4print"
version = "0.1.0"
description = "Tile an image across a sheet of paper as a print-ready PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fpdf==1.7.2",
    "pillow>=10",
]

[project.scripts]
repeat4print = "repeat4print:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["repeat4print.py"]
sources = ["."]
